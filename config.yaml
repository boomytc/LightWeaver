# Product defaults. Loaded after config.local.yaml and environment variables.
# Save private credentials and overrides in config.local.yaml or desktop settings.
modelbest_base_url: 'https://api.modelbest.cn/v1'
modelbest_api_key: ''
deepseek_base_url: 'https://api.deepseek.com'
deepseek_api_key: ''

vlm_provider: 'modelbest-vlm'  # or deepseek-vlm; CLI analyze --provider overrides this choice
vlm_model: 'MiniCPM-V-4.7-35B-A3B'
deepseek_model: 'deepseek-flash'
tts_model: 'VoxCPM2'

# Model files are downloaded only by an explicit `weaver models download`.
# The Studio model page or `weaver models use --path` binds an existing directory.
# Source checkout uses only the monorepo data/models/; installed desktop uses its user model directory.
# Root models/ and weaver/models/ are legacy locations and are not read or written.
model_download_root: 'data/models'

# Engine runtime (native libraries, llama-server, Python environments) installs into
# the engine root below only on an explicit `weaver engines install`.
# Source checkout defaults to data/engines (ignored); installed desktop defaults to
# <data directory>/engines. An explicit engine_install_root follows configBase.
# engine_install_root: 'data/engines'

# Explicit local runtime. No implicit sibling checkout discovery or automatic download.
# asr_model: '/absolute/runtime/qwen3-asr-0.6b-Q8_0.gguf'
# asr_library: '/absolute/runtime/libtranscribe.dylib'
# asr_bindings: '/absolute/runtime/transcribe.cpp/bindings/python/src'
# vad_library: '/absolute/runtime/ten_vad.framework/Versions/A/ten_vad'

# Optional local capabilities. Relative paths resolve from runtime configBase.
# Packaged desktop: choose absolute paths in Settings > Runtime and paths.
# Source checkout install (run in repository): uv venv --python 3.12 weaver/.venv
#          uv pip install --python weaver/.venv/bin/python -r weaver/requirements.models.txt
# Python defaults to weaver/.venv/Scripts/python.exe on Windows, bin/python elsewhere.
# model_python: '/absolute/model-environment/python'
# Alignment uses the official Qwen3 ForcedAligner weights through Torch.
# alignment_model: 'models/qwen3-forced-aligner/<revision>'
alignment_device: 'cpu'  # cpu or cuda[:index]
# GGUF weights are loaded by a job-owned llama-server; no persistent service is needed.
llama_server: 'llama-server'

# Text and visual retrieval share EmbeddingGemma 2, mmproj and this llama-server build.
# visual_model: 'models/embeddinggemma-2/<revision>/embeddinggemma-2-Q8_0.gguf'
# visual_mmproj: 'models/embeddinggemma-2/<revision>/mmproj-F16.gguf'
# visual_server: 'data/engines/llama-server/llama-server'

# Optional local TTS has its own environment; ModelBest VoxCPM2 needs no local TTS model.
# speech_python: '/absolute/speech-environment/python'
# local_tts_model: 'models/VoxCPM2'
# translation_model: 'models/Hy-MT2-1.8B-Q4_K_M.gguf'
translation_server: 'llama-server'
diarization_backend: 'auto'
