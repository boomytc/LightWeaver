<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>LightWeaver</title>
    <style>
      body { margin: 0; font: 15px/1.5 "PingFang SC", "Noto Sans SC", sans-serif; background: #10141a; color: #e7edf5; display: grid; min-height: 100vh; place-items: center; }
      main { width: min(520px, calc(100% - 48px)); }
      button { font: inherit; margin-right: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid #8ea0bd; background: #1c2430; color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>LightWeaver</h1>
      <p id="status">正在准备本地服务…</p>
      <p id="actions" hidden>
        <button id="retry" type="button">重试</button>
        <button id="logs" type="button">查看诊断</button>
      </p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const error = params.get("error");
      const status = document.getElementById("status");
      const actions = document.getElementById("actions");
      const retry = document.getElementById("retry");
      if (error) {
        status.textContent = error;
        actions.hidden = false;
      }
      retry.addEventListener("click", async () => {
        if (!window.lightweaver) return;
        retry.disabled = true;
        status.textContent = "正在重新启动本地服务…";
        try {
          await window.lightweaver.retry();
        } catch (reason) {
          status.textContent = reason instanceof Error ? reason.message : String(reason);
          actions.hidden = false;
        } finally {
          retry.disabled = false;
        }
      });
      document.getElementById("logs").addEventListener("click", () => window.lightweaver && window.lightweaver.openLogs());
    </script>
  </body>
</html>
