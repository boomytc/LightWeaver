<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <meta name="color-scheme" content="light dark" />
    <title>LightWeaver</title>
    <style>
      :root { color-scheme: light; --canvas: #f4f5f8; --panel: #fff; --ink: #17181c; --muted: #606672; --line: rgb(23 24 28 / .1); --accent: #3468f6; --accent-ink: #fff; --accent-soft: #edf2ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { width: min(460px, calc(100% - 40px)); border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 32px; box-shadow: 0 16px 48px rgb(23 24 28 / .08); }
      .brand { display: flex; align-items: center; gap: 12px; }
      .mark { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid rgb(52 104 246 / .22); border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 18px; font-weight: 650; }
      h1 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
      .subtitle { margin: 1px 0 0; color: var(--muted); font-size: 12px; }
      .status-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 24px; }
      .loader { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 4px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
      .loader[hidden] { display: none; }
      #status { margin: 0; overflow-wrap: anywhere; }
      #actions { display: flex; gap: 8px; margin: 24px 0 0; }
      #actions[hidden] { display: none; }
      button { height: 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 0 14px; color: inherit; font: inherit; font-weight: 550; cursor: pointer; }
      button:hover { background: var(--accent-soft); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: .45; cursor: default; }
      #retry { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --canvas: #101115; --panel: #17191f; --ink: #eceef3; --muted: #a1a8b4; --line: rgb(255 255 255 / .1); --accent: #7898ff; --accent-ink: #10141f; --accent-soft: rgb(120 152 255 / .14); }
        main { box-shadow: 0 16px 48px rgb(0 0 0 / .24); }
      }
      @media (prefers-reduced-motion: reduce) { .loader { animation-duration: 1.8s; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark" aria-hidden="true">LW</div>
        <div><h1>LightWeaver</h1><p class="subtitle">本地创作工作台</p></div>
      </div>
      <div class="status-row"><span id="loader" class="loader" aria-hidden="true"></span><p id="status" role="status">正在准备本地服务…</p></div>
      <p id="actions" hidden>
        <button id="retry" type="button">重试</button>
        <button id="logs" type="button">查看诊断</button>
      </p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const error = params.get("error");
      const loader = document.getElementById("loader");
      const status = document.getElementById("status");
      const actions = document.getElementById("actions");
      const retry = document.getElementById("retry");
      if (error) {
        loader.hidden = true;
        status.textContent = error;
        actions.hidden = false;
      }
      retry.addEventListener("click", async () => {
        if (!window.lightweaver) return;
        retry.disabled = true;
        actions.hidden = true;
        loader.hidden = false;
        status.textContent = "正在重新启动本地服务…";
        try {
          await window.lightweaver.retry();
        } catch (reason) {
          loader.hidden = true;
          status.textContent = reason instanceof Error ? reason.message : String(reason);
          actions.hidden = false;
        } finally {
          retry.disabled = false;
        }
      });
      document.getElementById("logs").addEventListener("click", () => window.lightweaver && window.lightweaver.openLogs());
    </script>
  </body>
</html>
