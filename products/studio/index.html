<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LightWeaver 本机控制站：人管音色和可复用素材，片子由 agent 编排生成。" />
    <title>LightWeaver</title>
    <script>
      (function () {
        try {
          var bridge = window.lightweaver;
          var theme = bridge && typeof bridge.themeSync === "function" ? bridge.themeSync() : "";
          if (theme !== "light" && theme !== "dark" && theme !== "system") {
            theme = new URLSearchParams(location.search).get("theme");
          }
          if (theme === "system" || (theme !== "light" && theme !== "dark")) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
